PROJECT_PATH="Apparition.xcodeproj"

# Platform aliases. The appstore config and the terminal both pass one as PLATFORM:
#   visionOS  Apparition on Vision Pro (AVP)                  (default)
#   tvOS      Apparition on Apple TV (ATV), atv-dev profile
#   iOS       Apparition on iPhone (ixPhone)
#   iPad      Apparition on iPad (YPad), the same iOS build
# The target supports visionOS, iOS (iPhone and iPad) and tvOS natively; one bundle id throughout.
# A --device flag still outranks DEVICE_NAME here, and an env DEVICE_NAME is respected.
ALIAS="${PLATFORM:-visionOS}"
case "$ALIAS" in
    visionOS) PLATFORM=visionOS; CORE_PLATFORM=visionos; DEVICE_NAME="${DEVICE_NAME:-AVP}" ;;
    tvOS)     PLATFORM=tvOS; CORE_PLATFORM=tvos; DEVICE_NAME="${DEVICE_NAME:-ATV}" ;;
    iOS)      PLATFORM=iOS; CORE_PLATFORM=ios; DEVICE_NAME="${DEVICE_NAME:-ixPhone}" ;;
    iPad)     PLATFORM=iOS; CORE_PLATFORM=ios; DEVICE_NAME="${DEVICE_NAME:-YPad}" ;;
esac

# The project and Rust library are generated, ignored build inputs. Refresh both for every
# build so the version and linked core match the checkout being stamped into the app.
PRE_BUILD_HOOK="xcodegen generate --quiet && scripts/build-core.sh ${CORE_PLATFORM:?Unsupported platform alias}"

SCHEME_NAME="${SCHEME_NAME:-Apparition}"
TARGET_NAME="${TARGET_NAME:-Apparition}"
BUILD_BUNDLE_ID="${BUILD_BUNDLE_ID:-com.illixion.apparition}"

# tvOS: the wildcard profile can't install on the Apple TV (0xe8008012). atv-dev is a tvOS
# profile with the ATV's UDID; tvOS accepts it although its App ID is VisionVNC's.
if [[ "$PLATFORM" == tvOS ]]; then DEV_PROFILE_PATH="$HOME/.config/build-signing/profiles/atv-dev.mobileprovision"; fi
