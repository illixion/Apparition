PROJECT_PATH="Apparition.xcodeproj"

# Platform aliases. The appstore config and the terminal both pass one as PLATFORM:
#   visionOS  Apparition on Vision Pro (AVP)                  (default)
#   tvOS      Apparition on Apple TV (ATV), atv-dev profile
#   iOS       ApparitionLab on iPhone (ixPhone)
#   iPad      ApparitionLab on iPad (YPad), the same iOS build
# The lab is a separate scheme and bundle id (com.illixion.apparition.lab); the native app is visionOS only.
# A --device flag still outranks DEVICE_NAME here, and an env DEVICE_NAME is respected.
ALIAS="${PLATFORM:-visionOS}"
case "$ALIAS" in
    visionOS) PLATFORM=visionOS; DEVICE_NAME="${DEVICE_NAME:-AVP}" ;;
    tvOS)     PLATFORM=tvOS;     DEVICE_NAME="${DEVICE_NAME:-ATV}" ;;
    iOS)      PLATFORM=iOS;      DEVICE_NAME="${DEVICE_NAME:-ixPhone}"; LAB=1 ;;
    iPad)     PLATFORM=iOS;      DEVICE_NAME="${DEVICE_NAME:-YPad}";    LAB=1 ;;
esac

if [[ -n "${LAB:-}" ]]; then
    SCHEME_NAME=ApparitionLab
    TARGET_NAME=ApparitionLab
    BUILD_BUNDLE_ID="${BUILD_BUNDLE_ID:-com.illixion.apparition.lab}"
else
    SCHEME_NAME="${SCHEME_NAME:-Apparition}"
    TARGET_NAME="${TARGET_NAME:-Apparition}"
    BUILD_BUNDLE_ID="${BUILD_BUNDLE_ID:-com.illixion.apparition}"
fi

# tvOS: the wildcard profile can't install on the Apple TV (0xe8008012). atv-dev is a tvOS
# profile with the ATV's UDID; tvOS accepts it although its App ID is VisionVNC's.
if [[ "$PLATFORM" == tvOS ]]; then DEV_PROFILE_PATH="$HOME/.config/build-signing/profiles/atv-dev.mobileprovision"; fi
