[package]
name = "apparition-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apparition as a desktop app: a guided way to put Apparition on your Apple devices from Windows, Linux or macOS, and the companion it uses from the tray"

[[bin]]
name = "apparition-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apparition-core = { path = "../core", features = ["desktop"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rootcause = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The core's patches apply only where it is the root, so they're repeated here.
[patch.crates-io]
apple-codesign-quick = { path = "../core/vendor/apple-codesign-quick" }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }

[profile.release]
lto = "thin"

[features]
# Serves the bundled ui/ instead of a dev server. `cargo tauri build` turns it on; a plain
# `cargo build` for a release (scripts/package-release.sh, Windows) passes it.
custom-protocol = ["tauri/custom-protocol"]

# Anisette from Apple's own libraries, in this process (core/src/anisette). macOS only for now: the
# Linux build is untested.
[target.'cfg(target_os = "macos")'.dependencies]
apparition-core = { path = "../core", features = ["anisette"] }
