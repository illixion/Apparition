[package]
name = "apparition-desktop"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Apparition as a desktop app: install apps on your Apple devices, or build and keep your own, from Windows, Linux or macOS, and the companion it uses from the tray"

[[bin]]
name = "apparition-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `anisette`: the anisette provider in this process (core/src/anisette). A Mac's own on macOS, and Apple
# Music's Android libraries on macOS, Linux and Windows (switched by anisette::ANDROID_LIBRARIES). The anisette
# can also come from a paired Mac or a server the person runs.
apparition-core = { path = "../core", features = ["desktop", "anisette"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rootcause = "0.12.0"
# Release checks and verified downloads, shared with the other apps. Vendored: scripts/vendor-signed-update.sh.
signed-update = { path = "../core/vendor/signed-update", features = ["ech"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "system-proxy"] }
sha2 = "0.10"
tempfile = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# The Apparition Store, in-process: deploys from other computers, kept builds and the apps'
# debug servers (MCP), on every desktop OS. Builds with Xcode stay on a Mac.
apparition-service = { path = "../service", features = ["hosted"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
base64 = "0.22"
dunce = "1"
# The updater asks whether the background service runs from this copy's folder.
windows-registry = "0.6"

[features]
# Serves the bundled ui/ instead of a dev server. `cargo tauri build` turns it on; a plain
# `cargo build` for a release (scripts/package-release.sh, Windows) passes it.
custom-protocol = ["tauri/custom-protocol"]
