[package]
name = "apparition-desktop"
version = "0.4.5"
edition = "2024"
license = "MIT"
description = "Apparition as a desktop app: install apps on your Apple devices, or build and keep your own, from Windows, Linux or macOS, and the companion it uses from the tray"

[[bin]]
name = "apparition-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apparition-core = { path = "../core", features = ["desktop"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rootcause = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "system-proxy"] }
sha2 = "0.10"
tempfile = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# This Mac's own anisette, served in this process (core/src/anisette): macOS only. Elsewhere the
# anisette comes from a paired Mac (core/src/companion_client.rs) or a server the person runs.
apparition-core = { path = "../core", features = ["anisette"] }
# The Apparition Store, in-process: builds, deploys and the apps' debug servers (MCP).
apparition-service = { path = "../service" }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
dunce = "1"

[features]
# Serves the bundled ui/ instead of a dev server. `cargo tauri build` turns it on; a plain
# `cargo build` for a release (scripts/package-release.sh, Windows) passes it.
custom-protocol = ["tauri/custom-protocol"]
