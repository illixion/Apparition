# Builds a release's files with scripts/package-release.sh, the same script as a local build,
# and attests where each came from (`gh attestation verify <file> -R illixion/Apparition`).
#
# Nothing here signs a release. The files land as a workflow artifact; publishing them is the
# usual step on the release site (scripts/publish.py add), which hashes the files downloaded from
# here and signs that list with a release key that never leaves its owner. So an attestation says
# "GitHub built this from that commit", and the release signature says "and its owner vouches
# for it". The owner checks before signing: publish.py runs scripts/audit-release.sh, which audits
# the attested commit's dependencies and rebuilds the macOS files from it on another Mac, and signs
# nothing unless they come out the same as these.
#
# The desktop app's updater (signed-update, vendored in core/vendor/signed-update) reads the signed
# manifest from the GitHub release, through apps.illixion.com's redirects: so the owner attaches
# SHA256SUMS and SHA256SUMS.sig to the release (the release command does), and a release is offered to
# the desktop app only once it is published.
#
# Run it by hand (Actions > Release build > Run workflow) or by pushing a v<version> tag. The
# version must already be committed in project.yml, installer/Cargo.toml and desktop/Cargo.toml.
#
# A fix that only touches the Apple apps needs only the IPAs: run it by hand with `parts` set to
# "app" (the others are skipped, and project.yml is then the only version that must be bumped).
# The release site lists such a release as the latest, and keeps offering the installers of the
# last release that has them. Tags build only parts whose committed versions match the tag.
#
# Caches: a run restores only caches saved on its own ref or on main, so ones a tag saved were
# never used again (every release built cold, 40 to 70 minutes). So only runs on main save them:
# a weekly run with no version builds every part at its committed version to warm them, publishing
# nothing, and a release tag starts from there. Run it by hand (no version) after changing
# dependencies or the toolchain, so the next release starts warm.
#
# A part that fails (a macOS runner that never comes, say) holds up only itself: the parts build on
# separate runners side by side (Windows and Linux never on a Mac), the others finish and upload
# their files, and only Attest waits for all of them. "Re-run failed jobs" then builds just the
# failed ones; the finished ones' artifacts stay with the run. Each build job also keeps its
# finished files in a cache of their own, for that commit and version on that ref, and a later
# run there ("Re-run all jobs", the tag pushed again, the same dispatch) takes them from it
# instead of building again. The attestation then names the run that attests, though the files came
# from an earlier run of this workflow, of the same commit.

name: Release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (major.minor.patch), as committed; empty only warms the caches"
        required: false
      parts:
        description: "What to build: all, or a comma-separated list of app, macos, windows, linux"
        default: all
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
  # Caches are saved only here, where every release can restore them (see the top).
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
# The Rust toolchain and the macOS files' Xcode come from scripts/release-toolchain, which the
# audit of a release (scripts/audit-release.sh) reads too: it rebuilds the macOS files with them
# and signs nothing unless it gets CI's bytes. Actions are pinned to commits, not tags, which can
# be moved; the comment names the tag each was taken from (2026-11-04).

jobs:
  # Tags select matching committed versions; dispatches build the requested parts. Each
  # job below takes its matrix from here and is skipped when its matrix is empty.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      warm: ${{ steps.plan.outputs.warm }}
      apple: ${{ steps.plan.outputs.apple }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          PARTS: ${{ inputs.parts }}
        run: |
          set -o pipefail
          python3 scripts/test-release-plan.py
          python3 scripts/release-plan.py "$VERSION" "$PARTS" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  apple:
    name: ${{ matrix.title }}
    needs: plan
    if: needs.plan.outputs.apple != '[]'
    # One job per part of package-release.sh, side by side: built cold one after another they
    # took over two hours, past a job's limit.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apple) }}
    # The image with Xcode 27 (macos-26 has only Xcode 26).
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      # The app builds against two sibling packages by path (project.yml), so they're checked
      # out beside it, the way they sit on a developer's machine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: Apparition
          fetch-depth: 0 # the build number is the commit count
      # This part's files from an earlier run of this commit and version (see the top): then
      # nothing below builds, and they are uploaded as they are.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: finished
        if: needs.plan.outputs.warm != 'true'
        with:
          path: |
            Apparition/build/release
            Apparition/build/dsyms
          key: finished-${{ matrix.part }}-${{ matrix.version }}-${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.part == 'app' && steps.finished.outputs.cache-hit != 'true'
        with: { repository: illixion/DebugTrace, path: DebugTrace }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.part == 'app' && steps.finished.outputs.cache-hit != 'true'
        with: { repository: illixion/RAVESDK, path: RAVESDK }
      - name: Record the sibling packages' commits
        if: matrix.part == 'app' && steps.finished.outputs.cache-hit != 'true'
        run: |
          for repo in DebugTrace RAVESDK; do
            echo "$repo $(git -C "$repo" rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Toolchain pins
        if: steps.finished.outputs.cache-hit != 'true'
        run: grep -E '^[A-Z_]+=' Apparition/scripts/release-toolchain | tee -a "$GITHUB_ENV"
      # The macOS files are built from one fixed path, the same on the machine that audits them
      # (scripts/package-release.sh, FIXED): Cargo puts the source path into every crate's symbols.
      - name: Move to the fixed build path
        if: matrix.part == 'macos' && steps.finished.outputs.cache-hit != 'true'
        run: |
          mkdir -p /private/tmp/apparition-build
          mv Apparition /private/tmp/apparition-build/Apparition
          ln -s /private/tmp/apparition-build/Apparition Apparition
      - name: Choose Xcode
        if: steps.finished.outputs.cache-hit != 'true'
        run: |
          if [[ "${{ matrix.part }}" == macos ]]; then
            # Exactly the build scripts/release-toolchain names, which the audit rebuilds with.
            for app in /Applications/Xcode_*.app; do
              build="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | sed -n 's/^Build version //p')"
              if [[ "$build" == "$XCODE_BUILD" ]]; then sudo xcode-select -s "$app"; break; fi
            done
            if [[ "$(xcodebuild -version | sed -n 's/^Build version //p')" != "$XCODE_BUILD" ]]; then
              echo "::error::this image has no Xcode build $XCODE_BUILD (scripts/release-toolchain)"
              for app in /Applications/Xcode_*.app; do echo "$app: $(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | tr '\n' ' ')"; done
              exit 1
            fi
          else
            # 27.0, the release Xcode, not the image's betas.
            sudo xcode-select -s /Applications/Xcode_27.0.app
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'xros|iphoneos|appletvos'
      - name: Tools
        if: steps.finished.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.targets }}"
          rustup default "$RUST_TOOLCHAIN"
          if [[ -n "${{ matrix.brew }}" ]]; then brew install ${{ matrix.brew }}; fi
      # Tauri's prebuilt CLI, checked against pinned hashes; compiling it took about 9 minutes.
      - name: Tauri CLI
        if: matrix.part == 'macos' && steps.finished.outputs.cache-hit != 'true'
        working-directory: Apparition
        run: scripts/install-tauri-cli.sh
      # The two workspaces' dependencies (core, and the installer with the desktop app), compiled
      # for every target; Apparition's own crates always build afresh. Kept even when the build
      # fails, so a rerun starts warm.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.finished.outputs.cache-hit != 'true'
        with:
          workspaces: |
            Apparition
            Apparition/core
          # "-repro": the macOS files' dependencies built with SOURCE_DATE_EPOCH and the path
          # remapping (package-release.sh), never restored from builds made without them.
          key: ${{ matrix.part }}-repro
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build
        if: steps.finished.outputs.cache-hit != 'true'
        working-directory: Apparition
        run: scripts/package-release.sh "${{ matrix.version }}" --parts ${{ matrix.part }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: needs.plan.outputs.warm != 'true' && steps.finished.outputs.cache-hit != 'true'
        with:
          path: |
            Apparition/build/release
            Apparition/build/dsyms
          key: ${{ steps.finished.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.plan.outputs.warm != 'true'
        with:
          name: apple-${{ matrix.part }}
          path: Apparition/build/release/*/*
          if-no-files-found: error
      # The IPAs' symbols, in an artifact of their own: the release site takes every file of the
      # release artifact as a release file, and refuses these.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.part == 'app' && needs.plan.outputs.warm != 'true'
        with:
          name: dsyms
          path: Apparition/build/dsyms/*/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.linux != '[]'
    strategy:
      # One architecture failing shouldn't cancel the other: both results are worth seeing.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: Apparition
          fetch-depth: 0
      # This architecture's files from an earlier run of this commit and version (see the top).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: finished
        if: needs.plan.outputs.warm != 'true'
        with:
          path: Apparition/build/release
          key: finished-linux-${{ matrix.arch }}-${{ matrix.version }}-${{ github.sha }}
      # The desktop image (WebKitGTK, Rust and the Tauri CLI) from the layer cache, rather than
      # built afresh.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.finished.outputs.cache-hit != 'true'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.finished.outputs.cache-hit != 'true'
        env:
          # No build record artifact: the attest job wants only the release's own.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: Apparition/scripts
          file: Apparition/scripts/desktop-linux.Dockerfile
          tags: apparition-desktop-linux:${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=desktop-linux-${{ matrix.arch }}
          cache-to: ${{ env.SAVE_CACHE == 'true' && format('type=gha,mode=max,scope=desktop-linux-{0}', matrix.arch) || '' }}
      # The registries and build output the containers keep (LINUX_CACHE in the script).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: linux-cache
        if: steps.finished.outputs.cache-hit != 'true'
        with:
          path: ~/linux-cache
          key: linux-${{ matrix.arch }}-${{ hashFiles('Apparition/Cargo.lock') }}
          restore-keys: linux-${{ matrix.arch }}-
      - name: Build, in the same Docker images as a local build
        if: steps.finished.outputs.cache-hit != 'true'
        working-directory: Apparition
        env:
          LINUX_ARCHS: ${{ matrix.arch }}
          LINUX_DESKTOP_IMAGE_BUILT: "1"
        run: |
          mkdir -p ~/linux-cache && export LINUX_CACHE=~/linux-cache
          scripts/package-release.sh "${{ matrix.version }}" --parts linux
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: needs.plan.outputs.warm != 'true' && steps.finished.outputs.cache-hit != 'true'
        with:
          path: Apparition/build/release
          key: ${{ steps.finished.outputs.cache-primary-key }}
      # Saved even when the build fails, so a rerun starts warm; once per lock file, as each
      # takes a couple of gigabytes of the repository's 10.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always() && env.SAVE_CACHE == 'true' && steps.finished.outputs.cache-hit != 'true' && steps.linux-cache.outputs.cache-hit != 'true'
        with:
          path: ~/linux-cache
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.plan.outputs.warm != 'true'
        with:
          name: linux-${{ matrix.arch }}
          path: Apparition/build/release/*/*
          if-no-files-found: error

  # The "windows" part, natively with MSVC on Windows: x86_64-pc-windows-msvc on windows-2025 and
  # aarch64-pc-windows-msvc on windows-11-arm, with the image's Visual Studio and LLVM (whose clang
  # ring and aws-lc need on ARM64, and whose llvm-objdump checks the programs' imports).
  windows:
    name: Windows ${{ matrix.arch }} installer
    needs: plan
    if: needs.plan.outputs.windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # On ARM64, package-release.sh sets CPPFLAGS=-Gs itself (OpenSSL's /Gs0 is miscompiled by MSVC
    # there; the script says why).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: Apparition
          fetch-depth: 0 # the build number is the commit count
      # This architecture's files from an earlier run of this commit and version (see the top).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: finished
        if: needs.plan.outputs.warm != 'true'
        with:
          path: Apparition/build/release
          key: finished-windows-${{ matrix.arch }}-${{ matrix.version }}-${{ github.sha }}
      - name: Toolchain pins
        if: steps.finished.outputs.cache-hit != 'true'
        run: grep -E '^[A-Z_]+=' Apparition/scripts/release-toolchain | tee -a "$GITHUB_ENV"
      - name: Tools
        if: steps.finished.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"
          printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          # NSIS makes the setup program (scripts/windows/setup.nsi). It is x86, under emulation on
          # ARM64; the image may or may not carry it.
          if ! command -v makensis >/dev/null && [[ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
            choco install nsis --no-progress -y
          fi
          # Strawberry Perl configures OpenSSL (Git Bash's perl can't); package-release.sh uses it.
          if [[ ! -x /c/Strawberry/perl/bin/perl.exe ]]; then
            choco install strawberryperl --no-progress -y
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.finished.outputs.cache-hit != 'true'
        with:
          workspaces: Apparition
          key: windows-${{ matrix.arch }}-msvc
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build
        if: steps.finished.outputs.cache-hit != 'true'
        working-directory: Apparition
        env:
          WINDOWS_ARCHS: ${{ matrix.arch }}
        run: scripts/package-release.sh "${{ matrix.version }}" --parts windows
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: needs.plan.outputs.warm != 'true' && steps.finished.outputs.cache-hit != 'true'
        with:
          path: Apparition/build/release
          key: ${{ steps.finished.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.plan.outputs.warm != 'true'
        with:
          name: windows-${{ matrix.arch }}
          path: Apparition/build/release/*/*
          if-no-files-found: error

  attest:
    name: Attest
    # Parts that weren't asked for are skipped, which would skip this too without the condition.
    needs: [plan, apple, linux, windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.warm != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: files
          # The build jobs' own artifacts, nothing another action uploaded (a Docker build
          # record failed its digest check every time).
          pattern: "{apple,linux,windows}-*"
          merge-multiple: true
      - name: List
        run: |
          set -o pipefail
          # Each build uploads build/release/<version>/; merged, they can keep that folder.
          find files -mindepth 2 -type f -name 'Apparition-*' -exec mv -n {} files/ \;
          find files -mindepth 1 -type d -empty -delete
          cd files && ls -l && sha256sum Apparition-* | tee SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: contains(format(',{0},', needs.plan.outputs.parts), ',app,')
        with:
          name: dsyms
          path: symbols
      - name: List the symbols
        if: contains(format(',{0},', needs.plan.outputs.parts), ',app,')
        run: |
          set -o pipefail
          cd symbols && ls -l && sha256sum Apparition-* | tee SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            files/Apparition-*
            symbols/Apparition-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ env.VERSION }}
          # Only the release's own files: publish.py takes every file in the folder as one.
          path: files/Apparition-*
      # The symbols go on the GitHub release beside the IPAs, but not to the site.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: contains(format(',{0},', needs.plan.outputs.parts), ',app,')
        with:
          name: dsyms-${{ env.VERSION }}
          path: symbols/Apparition-*
