name: 💡 Feature request
description: Suggest an idea or a feature request
title: "[Feature]: "
labels: ["enhancement"]
body:
- type: markdown
  attributes:
    value: |
      To ask for a particular app to work, use **App support** instead.
- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if this feature has already been suggested.
    options:
    - label: I have searched the existing issues
      required: true
- type: dropdown
  attributes:
    label: Which part is it for?
    options:
    - Apparition on Apple Vision Pro
    - Apparition on iPhone or iPad
    - Apparition on Apple TV
    - Desktop app
    - Command line (apparition)
    - Companion
    - Website
    - Not sure
  validations:
    required: false
- type: textarea
  attributes:
    label: Is your feature request related to a problem? Please describe.
    description: A clear and concise description of what the problem is.
    placeholder: "I'm always frustrated when [...]"
  validations:
    required: false
- type: textarea
  attributes:
    label: Describe your idea or feature request
    description: A clear and concise description of what you want to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe alternatives you've considered
    description: A clear and concise description of any alternative solutions or features you've considered, including other tools you use for this today.
  validations:
    required: false
- type: textarea
  attributes:
    label: Anything else?
    description: |
      Add any other context or screenshots about the feature request here.

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
