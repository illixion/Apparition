name: 🖥️ Desktop app or command line bug
description: The desktop app (macOS, Windows, Linux), its setup program or Windows service, the companion, or the command line does something wrong
title: "[Desktop]: "
labels: ["bug", "desktop", "triage"]
body:
- type: markdown
  attributes:
    value: |
      **Easiest way to file this:** in the desktop app, open **Settings > Troubleshooting > Report a problem…**. It opens this form with the version and your computer's OS already filled in. It sends nothing by itself.

      This form is for the **desktop app, the command line and the companion** (the relay and anisette that run on your computer). For a problem inside Apparition on a Vision Pro, iPhone, iPad or Apple TV, use **Bug in the Apparition app** instead: that app has its own *Report a Problem* in Settings. For an app that won't install or run, use **App support**.

      Never paste your Apple ID password, a certificate's password or a signing key. A 2FA code is fine to leave out too.
- type: checkboxes
  id: searched
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an issue already exists for the bug you encountered.
    options:
    - label: I have searched the existing issues
      required: true
- type: dropdown
  id: where
  attributes:
    label: Where does it happen?
    options:
    - Desktop app (macOS)
    - Desktop app (Windows)
    - Desktop app (Linux)
    - Command line (apparition)
    - Companion or Windows service
    - Not sure
  validations:
    required: true
- type: textarea
  id: current
  attributes:
    label: Current Behavior
    description: What you're experiencing, with the exact error text if there is one. Say which step it happens on (pairing, signing in, downloading, installing, settings).
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected Behavior
    description: What you expected to happen.
  validations:
    required: false
- type: textarea
  id: steps
  attributes:
    label: Steps To Reproduce
    placeholder: |
      1. Open Apparition...
      2. Click Install on...
      3. See error...
  validations:
    required: false
- type: input
  id: version
  attributes:
    label: Apparition version
    description: Filled in by *Report a problem…*. Otherwise the number in the download's file name, or the output of `apparition --version` (`apparition-cli --version` on Windows).
    placeholder: "1.0.0"
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: Computer and OS
    description: Filled in by *Report a problem…*. Otherwise your OS, its version and the chip (Intel/AMD or Arm).
    placeholder: "Windows 11 (build 26100.2605), x64"
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    value: |
        - Installed with (Windows: setup for just me / setup for everyone / zip; macOS: the app; Linux: AppImage / .deb / command line):
        - Signing with (free Apple ID / paid Apple ID / own certificate):
        - Device installed to, and its OS:
        - Reaching the device through (companion / LocalDevVPN / Tailscale / USB / not sure):
        - Anisette (this computer's / a Mac you paired / a server you run / not sure):
    render: markdown
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Logs and screenshots
    description: |
      A screenshot of the window, the progress list, or the command line's output.

      The desktop app and the command line don't make an encrypted trace like the iPhone and Vision Pro app does, so anything you attach is **public**. For a problem signing in to Apple, turn on **Settings > Troubleshooting > Record what a sign-in sends to Apple**, repeat the sign-in, then read the file (**Show the file**) and attach what's in it. It leaves out passwords, tokens and keys, but Apple's error text can name a team or app ID.

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    render: text
  validations:
    required: false
- type: textarea
  id: more
  attributes:
    label: Anything else?
    description: Links? References? Anything that will give us more context about the issue you are encountering!
  validations:
    required: false
