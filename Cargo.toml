# The installer (command line) and the desktop app, as one workspace: one lock file and one
# target directory, so a release builds both in a single cargo invocation per target and the core
# and its dependencies compile once for the pair, not once each. (Cargo unifies features only
# across the packages one invocation builds, so separate invocations would still rebuild them.)
#
# core/ stays a workspace of its own: scripts/build-core.sh builds it alone for the headset,
# iPhone and Apple TV, with its own lock file and target directory.
[workspace]
members = ["installer", "desktop"]
exclude = ["core", "build"]
resolver = "3"

# isideload depends on idevice from crates.io; use the same revision the core's FFI is built
# from, so each binary carries one copy of it. (Repeated from core/Cargo.toml: patches apply only
# where they're declared in the root.)
[patch.crates-io]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }

# Argon2id (sealing shared signing keys) takes seconds unoptimised; debug builds optimise it.
[profile.dev.package.argon2]
opt-level = 3

# Hashing and inflating an app to sign it, likewise: a 780 MB IPA took minutes to seal.
[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.release]
lto = "thin"
