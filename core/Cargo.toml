[package]
name = "apparition-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apparition's native core: Apple ID sign-in, signing (isideload) and device services (idevice) behind one C ABI"

[lib]
# staticlib for the app, rlib for the desktop installer (installer/).
crate-type = ["staticlib", "rlib"]

[dependencies]
# Linked here, rather than as a second static library, so the app carries one Rust runtime.
idevice-ffi = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065", default-features = false, features = ["ring", "core_device", "debug_proxy", "rsd", "remote_pairing", "tcp", "tunnel_tcp_stack", "afc", "house_arrest", "installation_proxy", "usbmuxd"] }
isideload = { git = "https://github.com/nab138/isideload.git", rev = "0bee45d8cdb07ca24524a26f38fdda0dbb4e04b3", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
zip = { version = "8.3", default-features = false, features = ["deflate"] }
plist = "1"
crc32fast = "1"
# Offline signing with an imported certificate (identity.rs), at the versions isideload uses.
apple-codesign-quick = "0.1.0"
p12-keystore = { version = "0.3.0-rc4", package = "isideload-p12-keystore" }
rsa = "0.9.10"
x509-cert = "0.2.5"
ring = "0.17"
# Sharing the Apple ID's certificate key (share.rs).
base64 = "0.22"
sha2 = "0.10"
# Official releases (release.rs): fetching them, and their SSHSIG signature.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
ed25519-dalek = "2"
# The desktop front ends' shared pieces (api.rs): where they keep pairings, and mDNS.
dirs = { version = "6", optional = true }
mdns-sd = { version = "0.21.5", optional = true }
# The anisette provider (anisette/): loading Apple's Android libraries into the process.
libc = { version = "0.2", optional = true }
flate2 = { version = "1", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"], optional = true }

[features]
# For the desktop installer and app; the headset's static library leaves it out.
desktop = ["dep:dirs", "dep:mdns-sd", "tokio/time", "tokio/net", "tokio/io-util", "tokio/process"]
# Anisette without Docker, on macOS and Linux (see anisette/mod.rs).
anisette = ["dep:libc", "dep:flate2", "dep:axum", "tokio/net", "tokio/time", "tokio/sync"]

[dev-dependencies]
rand = "0.8"
tokio = { version = "1.49", features = ["macros"] }

# isideload depends on idevice from crates.io; use the same revision the FFI is built from,
# so the binary carries one copy of it.
[patch.crates-io]
# Signs ExtensionKit extensions (Extensions/) too; see vendor/apple-codesign-quick/VENDORED.md.
apple-codesign-quick = { path = "vendor/apple-codesign-quick" }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }

[profile.release]
lto = "thin"
