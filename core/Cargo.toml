[package]
name = "apparition-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apparition's native core: Apple ID sign-in, signing (isideload) and device services (idevice) behind one C ABI"

[lib]
# staticlib for the app, rlib for the desktop installer (installer/).
crate-type = ["staticlib", "rlib"]

[dependencies]
# Linked here, rather than as a second static library, so the app carries one Rust runtime.
idevice-ffi = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065", default-features = false, features = ["ring", "core_device", "debug_proxy", "rsd", "remote_pairing", "tcp", "tunnel_tcp_stack", "afc", "house_arrest", "installation_proxy", "usbmuxd", "pair", "companion_proxy"] }
# isideload 0.5.0 vendored with our changes; see vendor/isideload/VENDORED.md.
# Release verification (SSHSIG, SHA256SUMS, versions), shared with the other apps; no HTTP here, the
# core fetches on its own. Vendored: see scripts/vendor-signed-update.sh.
signed-update = { path = "vendor/signed-update", default-features = false }
isideload = { path = "vendor/isideload", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The anisette provider wrapper in claimed_platform.rs implements isideload's async trait.
async-trait = "0.1"
tokio = { version = "1.49", features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# Apps published as a .deb (package.rs): its tar, and the xz, gzip and zstd the tar comes in.
tar = { version = "0.4", default-features = false }
xz2 = "0.1"
flate2 = "1"
ruzstd = "0.7"
plist = "1"
crc32fast = "1"
# Offline signing with an imported certificate (identity.rs), at the versions isideload uses.
# The signer (signer/) is ours, over indygreg's apple-codesign; isideload signs with it too.
apparition-signer = { path = "signer" }
p12-keystore = { version = "0.3.0-rc4", package = "isideload-p12-keystore" }
rsa = "0.9.10"
x509-cert = "0.2.5"
ring = "0.17"
# Sharing the Apple ID's certificate key (share.rs), and sealing it under a passphrase
# (ring's ChaCha20-Poly1305 and random numbers, above).
base64 = "0.22"
sha2 = "0.10"
argon2 = "0.5"
# Official releases (release.rs): fetching them, and their SSHSIG signature.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
reqwest-middleware = "0.5"
ed25519-dalek = "2"
# The desktop front ends' shared pieces (api.rs): where they keep pairings, and mDNS.
dirs = { version = "6", optional = true }
mdns-sd = { version = "0.21.5", optional = true }
# This computer's LAN addresses, where a device knocks to wake it (relay.rs); mdns-sd uses it too.
if-addrs = { version = "0.15", optional = true }
# Pairing a device with the companion (pairing.rs): RAVESDK's exchange, which needs a fixed
# X25519 key in its tests and a plain HKDF.
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
hkdf = { version = "0.12", optional = true }
# The companion's cross-platform implementation of RAVECompanion's TLS 1.2-PSK channel.
openssl = { version = "0.10", features = ["vendored"], optional = true }
tokio-openssl = { version = "0.6", optional = true }
# The anisette provider (anisette/): this Mac's own, from macOS, or Apple Music's Android libraries run in this
# process (libc is their C library), served over the v3 protocol.
libc = { version = "0.2", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"], optional = true }
# A third-party anisette server offered through the companion (anisette/remote.rs) is bridged to its
# provisioning WebSocket with the client isideload already uses, at the version it uses.
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3.31", optional = true }

[features]
# For the desktop installer and app; the headset's static library leaves it out.
desktop = ["anisette-server", "dep:dirs", "dep:mdns-sd", "dep:if-addrs", "dep:x25519-dalek", "dep:hkdf", "dep:openssl", "dep:tokio-openssl", "tokio/time", "tokio/net", "tokio/io-util", "tokio/process"]
# The anisette v3 server (anisette/server.rs) on every platform: the desktop companion offers a third-party
# server's anisette to paired devices through it (anisette/remote.rs).
anisette-server = ["dep:axum", "dep:tokio-tungstenite", "dep:futures-util", "tokio/net", "tokio/time", "tokio/sync"]
# Anisette made in this process: this Mac's own (macOS only), and Apple Music's Android libraries on macOS, Linux
# and Windows (see anisette/mod.rs).
anisette = ["anisette-server", "dep:libc"]



[[example]]
name = "signin_e2e"
required-features = ["desktop"]

[dev-dependencies]
rand = "0.8"
tempfile = "3"
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.49", features = ["macros"] }

# isideload depends on idevice from crates.io; use the same revision the FFI is built from,
# so the binary carries one copy of it.
[patch.crates-io]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }

# Argon2id (sealing shared signing keys) takes seconds unoptimised; debug builds optimise it.
[profile.dev.package.argon2]
opt-level = 3

# Hashing and inflating an app to sign it, likewise: a 780 MB IPA took minutes to seal.
[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.release]
lto = "thin"
# File and line for the core's frames in a crash report. The DWARF goes into the app's dSYM;
# package-release.sh strips the debug map it leaves in the binary.
debug = "line-tables-only"
