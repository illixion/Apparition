<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{BRAND_TITLE}}</title>
{{BRAND_HEAD}}
<meta name="theme-color" content="#0a0c10">
<style>
  :root {
    --bg: #0a0c10; --surface: #12151b; --surface2: #191d25; --line: #232833;
    --fg: #e6ebf3; --dim: #7d8699; --dim2: #565e6e; --accent: #4f8cff; --accent-fg: #06101f; --bad: #fa6464;
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
    --sans: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--fg); font-family: var(--sans); }
  form { width: min(340px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .wordmark { font-family: var(--mono); font-size: .92rem; font-weight: 700; color: var(--dim);
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .wordmark .tri { color: var(--accent); font-size: 2rem; line-height: 1; }
  .wordmark .brandicon { font-size: 2rem; line-height: 1; height: 2rem; width: auto; display: inline-block; }
  .wordmark b { color: var(--fg); }
  label { font-size: .82rem; color: var(--dim); display: flex; flex-direction: column; gap: 6px; }
  input { background: var(--surface2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 10px;
    font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #error { color: var(--bad); font-size: .82rem; min-height: 1.2em; margin: 0; }
</style>
</head>
<body>
<form id="form">
  <span class="wordmark">{{BRAND_MARK}} <b>{{BRAND_TITLE}}</b></span>
  <label>Password
    <input type="password" id="password" autocomplete="current-password" autofocus required>
  </label>
  <button type="submit" id="submit">Sign in</button>
  <p id="error" role="alert"></p>
</form>
<script>
const next = new URLSearchParams(location.search).get('next') || '/';
// Only same-site paths: never an open redirect.
const target = /^\/(?!\/)/.test(next) ? next : '/';
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const button = document.getElementById('submit'), error = document.getElementById('error');
  button.disabled = true; error.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }) });
    const body = await r.json().catch(() => ({}));
    if (r.ok) { location.replace(target); return; }
    error.textContent = body.error === 'wrong password' ? 'Wrong password.' : (body.error || `Sign-in failed (HTTP ${r.status}).`);
  } catch { error.textContent = "Can't reach the server."; }
  button.disabled = false;
  document.getElementById('password').select();
});
</script>
</body>
</html>
