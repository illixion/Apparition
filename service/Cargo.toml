[package]
name = "apparition-service"
version = "0.4.5"
edition = "2024"
license = "MIT"
description = "Apparition Store in Rust: the build, delivery and device service the desktop app runs in its own process"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# In a build with the core, reqwest is built with rustls but no crypto provider: the Store
# installs ring's (the core's) before its first client, so it works on its own too.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
futures-util = { version = "0.3", default-features = false }
tokio-stream = "0.1"
scrypt = { version = "0.12", default-features = false }
ring = "0.17"
subtle = "2"
base64 = "0.22"
libc = "0.2"
flate2 = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
plist = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
