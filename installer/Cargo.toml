[package]
name = "apparition-installer"
version = "0.4.5"
edition = "2024"
license = "MIT"
description = "Installs Apparition (or any IPA) onto an Apple Vision Pro from Windows, Linux or macOS: pairs over the network, signs with an Apple ID or your own certificate, installs"

[[bin]]
name = "apparition"
path = "src/main.rs"

# This Mac's anisette on macOS 27 with SIP and AMFI off; signed with anisette-helper.entitlements.
[[bin]]
name = "apparition-anisette-helper"
path = "src/anisette_helper.rs"

[dependencies]
apparition-core = { path = "../core", features = ["desktop"] }
rootcause = "0.12.0"
rpassword = "7"
serde_json = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-std", "io-util", "fs"] }
# `apparition build`: Info.plist edits, the trace key, digests.
plist = "1"
ring = "0.17"
base64 = "0.22"

# This Mac's own anisette, served in this process (core/src/anisette): macOS only. Elsewhere the
# anisette comes from a paired Mac (core/src/companion_client.rs) or a server the person runs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apparition-core = { path = "../core", features = ["anisette"] }

[dev-dependencies]
# The Store, for the end-to-end test of `mcp` and `deploy` through a paired companion.
apparition-service = { path = "../service" }
tempfile = "3"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
