[package]
name = "apparition-installer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Installs Apparition (or any IPA) onto an Apple Vision Pro from Windows, Linux or macOS: pairs over the network, signs with an Apple ID or your own certificate, installs"

[[bin]]
name = "apparition"
path = "src/main.rs"

[dependencies]
apparition-core = { path = "../core", features = ["desktop"] }
rootcause = "0.12.0"
rpassword = "7"
serde_json = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time", "signal"] }

# The core's patches apply only where it is the root, so they're repeated here.
[patch.crates-io]
apple-codesign-quick = { path = "../core/vendor/apple-codesign-quick" }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065" }

# Argon2id (sealing shared signing keys) takes seconds unoptimised; debug builds optimise it.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"

# Anisette from Apple's own libraries, in this process (core/src/anisette): macOS and Linux, not
# Windows (the loader maps ELF libraries with POSIX calls).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
apparition-core = { path = "../core", features = ["anisette"] }
