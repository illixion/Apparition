name: Apparition
options:
  bundleIdPrefix: com.illixion
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    # RAVESDK (RAVEUI's tab bar) declares visionOS 26.
    visionOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  DebugTrace:
    path: ../DebugTrace
  RAVESDK:
    path: ../RAVESDK
targets:
  Apparition:
    type: application
    platform: visionOS
    sources:
      - path: Probe
        excludes:
          - Info.plist
    dependencies:
      - package: DebugTrace
        product: DebugTrace
      - package: DebugTrace
        product: DebugTraceServer
      - package: DebugTrace
        product: DebugTraceUI
      - package: RAVESDK
        product: RAVEUI
    info:
      path: Probe/Info.plist
      properties:
        CFBundleDisplayName: Apparition
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Opening or sharing a certificate (.p12) or provisioning profile hands it to
        # Apparition, which imports it (SigningStore.receive).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Signing Certificate
            LSItemContentTypes: [com.rsa.pkcs-12]
            LSHandlerRank: Alternate
          - CFBundleTypeName: Provisioning Profile
            LSItemContentTypes: [com.apple.mobileprovision]
            LSHandlerRank: Owner
          - CFBundleTypeName: Apparition Signing File
            LSItemContentTypes: [com.illixion.apparition.signing]
            LSHandlerRank: Owner
        # A shared Apple ID certificate key (core/src/share.rs).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.illixion.apparition.signing
            UTTypeDescription: Apparition Signing File
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [apparitionsigning]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.mobileprovision
            UTTypeDescription: Provisioning Profile
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobileprovision]
              public.mime-type: [application/x-apple-aspen-mobileprovision]
        # The main window plus DebugTrace's approval window.
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.illixion.apparition.refresh
          - com.illixion.apparition.refresh-processing
        NSLocalNetworkUsageDescription: Apparition pairs with this device's own developer services over the local network.
        NSBonjourServices:
          - _remotepairing._tcp
          - _remotepairing-manual-pairing._tcp
          - _apparition._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illixion.apparition
        TARGETED_DEVICE_FAMILY: "7"
        SWIFT_OBJC_BRIDGING_HEADER: Probe/Apparition-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/core-out/include
        # scripts/build-core.sh stages one library per SDK (xros, xrsimulator, iphoneos).
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/core-out/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lapparition_core
        SWIFT_STRICT_CONCURRENCY: minimal
  ApparitionLab:
    type: application
    platform: iOS
    sources:
      - path: Lab
        excludes:
          - Info.plist
    info:
      path: Lab/Info.plist
      properties:
        CFBundleDisplayName: Apparition Lab
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illixion.apparition.lab
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Lab/ApparitionLab-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: minimal
  ApparitionCompanion:
    type: application
    platform: macOS
    sources:
      - path: Companion
        excludes:
          - Info.plist
      - path: selfhost/anisette/compose.yaml
        buildPhase: resources
    dependencies:
      - package: DebugTrace
        product: DebugTrace
    info:
      path: Companion/Info.plist
      properties:
        CFBundleDisplayName: Apparition Companion
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: Apparition Companion relays Apparition's connection back to your headset over the local network.
        NSBonjourServices:
          - _apparition._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illixion.apparition.companion
        DEVELOPMENT_TEAM: 9T5F88VJFL
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: minimal
